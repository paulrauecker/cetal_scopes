[project]
name = "cetal-scopes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paulrauecker", email = "paul.rauecker@gmx.at" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pyright>=1.1.406",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]



[tool.pytest.ini_options]
addopts = "-ra --cov=cetal_scopes --cov-report=term-missing"
testpaths = ["tests"]
