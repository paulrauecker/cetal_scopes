[project]
name = "capture-studio"
version = "0.1.0"
description = "Browser front end for multi-instrument single-shot capture and analysis."
requires-python = ">=3.12"
dependencies = [
    "cetal-scopes",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv]
package = false

[tool.uv.sources]
cetal-scopes = { workspace = true }
