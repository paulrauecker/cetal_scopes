# cetal-scopes capture studio inventory
poll_interval = 0.2
default_timeout = 10.0
arm_timeout = 5.0

[[instrument]]
label = "siglent"
driver = "siglent_sds6204l"
address = "192.168.0.11"
channels = ["C1", "C2", "C3", "C4"]
timeout = 10.0

[instrument.options]
timeout = 5
acquire_timeout = 10

[instrument.settings]
record_length = "500us"
pretrigger = 0.5
range = 0.1
offset = 0
coupling = "DC"
impedance = 50

[instrument.settings.trigger]
source = "C2"
level = 0.05
slope = "RISing"

# C1-C3 are the three loops of one 3D B-dot, C4 the PBS-H3 alongside it.
# axis = loop normal, signed so a rising B along it reads positive. Signs are
# not yet checked on the bench (magnet or Helmholtz coil) -- flip if inverted.
[instrument.antennas]
C1 = { antenna = "bdot-medium-a", axis = [0, 1, 0] }
C2 = { antenna = "bdot-large", axis = [0, 0, 1] }
C3 = { antenna = "bdot-small", axis = [1, 0, 0] }
C4 = { antenna = "PBS-H3", axis = [0, 0, 1] }

[[instrument]]
label = "m5i"
driver = "spectrum_m5i3367"
address = "/dev/spcm0"
channels = ["CH0", "CH1"]
timeout = 10.0

[instrument.options]
acquire_timeout = 10

[instrument.settings]
record_length = "500us"
pretrigger = 0.5
range = 0.1
offset = 0

[instrument.settings.trigger]
source = "CH0"
level = 0.05
slope = "RISing"

[instrument.antennas]
CH0 = "bdot-medium-b"
CH1 = "bdot-medium-c"
