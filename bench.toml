# The bench: an M5i.3367 digitiser on PCIe and an SDS6204L on the network.
# Load it with:  uv run apps/capture_studio/capture_studio.py --config bench.toml

poll_interval = 0.2        # how finely the trigger wait is sliced (abort latency)
default_timeout = 10.0
arm_timeout = 5.0

# --- Siglent SDS6204L, 192.168.5.171 ---------------------------------------

[[instrument]]
label = "siglent"
driver = "siglent_sds6204l"
address = "192.168.5.171"
channels = ["C1", "C2", "C3", "C4"]
timeout = 10.0

[instrument.options]
timeout = 5.0              # socket timeout for SCPI commands
acquire_timeout = 10.0

[instrument.settings]
# sample_rate omitted on purpose: an absent rate means "as fast as this
# instrument goes", which the driver answers (5 GS/s per channel here, and it
# does not drop when more channels are on -- each has its own converter).
# 500 us is the SHORTEST window this scope samples rather than interpolates.
# Measured with apps/capture_studio/probe_timebase_map.py: memory depth is not
# settable at all here (:ACQuire:MDEPth is rejected), so the scope stays in
# AUTO and maximises the rate -- taking the interpolated 10 GS/s "ESR" at
# every window up to 200 us. At 500 us (50 us/div) 10 GS/s would overrun
# memory, so it falls back to the native 5 GS/s: 2.5 Mpt, all of them real.
#
#   200 us -> 10 GS/s, half the samples reconstructed
#   500 us ->  5 GS/s, 2.5 Mpt, fully measured   <- here
#     1 ms ->  1 GS/s
#
# A shorter window still works and loses no real information -- the ADC is
# running at 5 GS/s either way -- but half the points it returns are padding.
record_length = "500us"    # a time suffix means a window: the sample count
                           # follows the resolved rate, so a faster rate buys
                           # more samples over the same window, not less time.
                           # Write a bare number for a literal sample count.
pretrigger = 0.5
range = 0.01               # weak signals: snaps to 5 mV/div, so +/-20 mV
offset = 0.0
coupling = "DC"
impedance = 50.0

[instrument.settings.trigger]
source = "C1"              # or "EX" / "EX5" for the external input
level = 0.001              # clamps to about +/-4.5 * V/div of the source
slope = "RISing"

# --- Spectrum M5i.3367 over PCIe -------------------------------------------

[[instrument]]
label = "m5i"
driver = "spectrum_m5i3367"
address = "/dev/spcm0"
channels = ["CH0", "CH1"]
timeout = 10.0

[instrument.options]
acquire_timeout = 10.0

[instrument.settings]
# sample_rate omitted on purpose: an absent rate means "as fast as this
# instrument goes". This card interleaves, so the ceiling follows the channel
# list above -- 5 GS/s with both, 10 GS/s the moment one is removed, with no
# other edit. Because the window is fixed below, that buys twice the samples
# over the same 50 us rather than halving the window.
record_length = "500us"    # same window as the siglent, so the two line up
pretrigger = 0.5
range = 0.2                # the card's most sensitive step; 0.2/0.5/1.0/2.5 V
offset = 0.0

[instrument.settings.trigger]
source = "EXT"             # the card's Ext0 "Trig In"; or "CH0" / "CH1"
# Volts at the connector, within +/-5 V -- but ONLY while the source is EXT.
# A channel source refers the level to that channel's `range` above (+/-0.2 V
# here), so switching to "CH0"/"CH1" without lowering this is a trigger that
# can never fire; connecting then refuses it.
level = 0.0015
slope = "RISing"
