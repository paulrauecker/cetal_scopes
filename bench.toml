# cetal-scopes capture studio inventory
poll_interval = 0.2
default_timeout = 10.0
arm_timeout = 5.0

[[instrument]]
label = "siglent"
driver = "siglent_sds6204l"
address = "192.168.0.11"
channels = ["C1", "C2", "C3", "C4"]
timeout = 10.0

[instrument.options]
timeout = 5
acquire_timeout = 10

[instrument.settings]
record_length = "500us"
pretrigger = 0.5
range = 0.05
offset = 0
coupling = "DC"
impedance = 50

[instrument.settings.trigger]
source = "C2"
level = 0.01
slope = "EITHER"

[[instrument]]
label = "m5i"
driver = "spectrum_m5i3367"
address = "/dev/spcm0"
channels = ["CH0", "CH1"]
timeout = 10.0
enabled = false

[instrument.options]
acquire_timeout = 10

[instrument.settings]
record_length = "500us"
pretrigger = 0.5
range = 0.8
offset = 0

[instrument.settings.trigger]
source = "CH0"
level = 0.05
slope = "EITHER"

[instrument.antennas]
CH0 = "bdot-medium-b"
CH1 = "bdot-medium-c"
