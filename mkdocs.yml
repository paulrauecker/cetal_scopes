site_name: cetal_scopes
site_url: https://paulrauecker.github.io/cetal_scopes/
repo_url: https://github.com/paulrauecker/cetal_scopes
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

# nav:
#   - Home: index.md
#   - Getting Started: getting-started.md
#   - Format Spec: format-spec.md
#   - Oscilloscopes: scopes/
#   - API Reference: api/reference.md
#
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy   # matches your docstring convention

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition        # nice callout boxes: !!! note / !!! warning
  - pymdownx.highlight # syntax highlighting
  - pymdownx.superfences


extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
